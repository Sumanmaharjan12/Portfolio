<div class="site-wrap site-wrap--visible">
  <app-navbar></app-navbar>
  
  <div class="blog-detail-container" *ngIf="blog; else notFound">
    <div class="blog-detail-header">
      <div class="blog-meta-top">
        <span class="blog-cat-badge">{{ blog.category }}</span>
        <span class="blog-dot">•</span>
        <span>{{ blog.date }}</span>
        <span class="blog-dot">•</span>
        <span>{{ blog.readTime }}</span>
      </div>
      <h1 class="blog-main-title">{{ blog.title }}</h1>
    </div>

    <div class="blog-hero-img">
      <img [src]="blog.image" [alt]="blog.title">
    </div>

    <div class="blog-content-body">
      <ng-container *ngFor="let block of blog.content">
        <h2 *ngIf="block.type === 'heading'">{{ block.text }}</h2>
        <p *ngIf="block.type === 'paragraph'">{{ block.text }}</p>
      </ng-container>
    </div>

    <div class="blog-back-wrap">
      <a routerLink="/homepage" class="btn btn--primary">← Back to Homepage</a>
    </div>
  </div>

  <ng-template #notFound>
    <div class="blog-not-found">
      <h2>Blog post not found</h2>
      <p>The article you are looking for does not exist or has been moved.</p>
      <a routerLink="/homepage" class="btn btn--primary">Return Home</a>
    </div>
  </ng-template>
</div>
